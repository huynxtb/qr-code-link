<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
<style>
  :root{--bg:#fbfbf9;--panel:#ffffff;--ink:#1a1a1a;--muted:#8c8c88;--line:#ececea;--accent:#1a1a1a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;}
  .card{width:100%;max-width:860px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;overflow:hidden;box-shadow:0 20px 60px -30px rgba(0,0,0,.18);}
  .head{padding:36px 40px 28px;border-bottom:1px solid var(--line);}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
  p.sub{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.5}
  .body{display:grid;grid-template-columns:1fr 1fr;gap:0;}
  @media(max-width:680px){.body{grid-template-columns:1fr}}
  .controls{padding:32px 40px;display:flex;flex-direction:column;gap:22px}
  label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    display:block;margin-bottom:8px;font-weight:600;}
  input[type=url],input[type=text],select{width:100%;background:#fff;border:1px solid var(--line);
    color:var(--ink);padding:12px 14px;border-radius:11px;font-size:14px;font-family:inherit;transition:border-color .2s;}
  input:focus,select:focus{outline:none;border-color:#1a1a1a}
  .swatches{display:flex;gap:10px}
  .sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s}
  .sw:hover{transform:scale(1.08)}
  .sw.on{border-color:#1a1a1a;box-shadow:0 0 0 2px #fff inset}
  button{background:#1a1a1a;color:#fff;border:none;padding:14px;border-radius:11px;cursor:pointer;
    font-size:13px;font-weight:600;letter-spacing:.03em;transition:opacity .2s}
  button:hover{opacity:.88}button:disabled{opacity:.35;cursor:not-allowed}
  .preview{background:#f4f4f1;border-left:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:36px;gap:18px;}
  @media(max-width:680px){.preview{border-left:none;border-top:1px solid var(--line)}}
  .stage{width:100%;max-width:280px;display:flex;align-items:center;justify-content:center;}
  canvas{width:100%;height:auto;border-radius:16px;box-shadow:0 12px 36px -16px rgba(0,0,0,.22);}
  .hint{color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <h1>QR code</h1>
      <p class="sub">Clean and simple. Paste your link, add a short caption, download.</p>
    </div>
    <div class="body">
      <div class="controls">
        <div><label for="qrtype">QR type</label>
          <select id="qrtype"><option value="link">Link / URL</option><option value="contact">Contact card</option><option value="wifi">Wi-Fi</option><option value="email">Email</option><option value="phone">Phone</option><option value="sms">SMS</option><option value="text">Plain text</option></select></div>

        <div class="grp" data-t="link"><label for="url">Your link</label>
          <input type="url" id="url" placeholder="https://example.com" value="https://"></div>

        <div class="grp" data-t="text" style="display:none"><label for="text">Text</label>
          <input type="text" id="text" placeholder="Anything you want encoded"></div>

        <div class="grp" data-t="phone" style="display:none"><label for="phone">Phone number</label>
          <input type="text" id="phone" placeholder="+1 555 123 4567"></div>

        <div class="grp" data-t="sms" style="display:none"><label for="smsnum">Number &amp; message</label>
          <input type="text" id="smsnum" placeholder="+1 555 123 4567">
          <input type="text" id="smsmsg" placeholder="Message (optional)" style="margin-top:10px"></div>

        <div class="grp" data-t="email" style="display:none"><label for="emailto">Email</label>
          <input type="text" id="emailto" placeholder="you@example.com">
          <input type="text" id="emailsub" placeholder="Subject (optional)" style="margin-top:10px">
          <input type="text" id="emailbody" placeholder="Body (optional)" style="margin-top:10px"></div>

        <div class="grp" data-t="wifi" style="display:none"><label for="wifissid">Wi-Fi details</label>
          <input type="text" id="wifissid" placeholder="Network name (SSID)">
          <input type="text" id="wifipass" placeholder="Password" style="margin-top:10px">
          <select id="wifienc" style="margin-top:10px"><option value="WPA">WPA / WPA2</option><option value="WEP">WEP</option><option value="nopass">No password</option></select></div>

        <div class="grp" data-t="contact" style="display:none"><label for="cname">Contact details</label>
          <input type="text" id="cname" placeholder="Full name">
          <input type="text" id="cphone" placeholder="Phone" style="margin-top:10px">
          <input type="text" id="cemail" placeholder="Email" style="margin-top:10px">
          <input type="text" id="corg" placeholder="Company (optional)" style="margin-top:10px">
          <input type="text" id="curl" placeholder="Website (optional)" style="margin-top:10px"></div>

        <div><label for="caption">Caption (optional)</label>
          <input type="text" id="caption" placeholder="Scan for my contact" maxlength="36"></div>
        <div><label for="icon">Center mark</label>
          <select id="icon"><option value="none">None</option><option value="custom">Custom (upload / emoji)…</option><option value="scan">Scan glyph</option><option value="link">Link</option><option value="at">@ symbol</option><option value="code">Code &lt;/&gt;</option><option value="person">Person</option><option value="phone">Phone</option><option value="mail">Mail</option></select></div>
        <div id="customMark" style="display:none">
          <label for="iconFile">Your icon</label>
          <input type="file" id="iconFile" accept="image/*" style="font-size:13px">
          <input type="text" id="iconEmoji" placeholder="…or type an emoji, e.g. ☎" maxlength="2" style="margin-top:10px"></div>
        <div><label for="style">Module style</label>
          <select id="style"><option value="rounded">Rounded</option><option value="dots">Dots</option><option value="square">Classic</option></select></div>
        <div><label>Color</label>
          <div class="swatches" id="sw"></div></div>
        <button id="download" disabled>Download PNG</button>
        <p class="hint" style="text-align:left">Tip: scan-test with your phone before printing.</p>
      </div>
      <div class="preview">
        <div class="stage"><canvas id="cv" width="100" height="100"></canvas></div>
        <div class="hint" id="status">Enter a valid link to generate</div>
      </div>
    </div>
  </div>

<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var urlI=document.getElementById('url'),capI=document.getElementById('caption'),iconI=document.getElementById('icon');
var swWrap=document.getElementById('sw'),dlBtn=document.getElementById('download'),status=document.getElementById('status');
var iconFile=document.getElementById('iconFile'),iconEmoji=document.getElementById('iconEmoji'),customMark=document.getElementById('customMark');
var customImg=null;
var qrtypeI=document.getElementById('qrtype');
var styleI=document.getElementById('style');
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function esc(s){return s.replace(/([\\;,:"])/g,'\\$1');}
function buildPayload(){
  var t=qrtypeI.value;
  if(t==='link'){var u=val('url');try{new URL(u);}catch(e){return null;}if(u==='https://'||u==='http://')return null;return u;}
  if(t==='text'){return val('text')||null;}
  if(t==='phone'){var p=val('phone');return p?'tel:'+p:null;}
  if(t==='sms'){var n=val('smsnum');if(!n)return null;var msg=val('smsmsg');return 'SMSTO:'+n+(msg?':'+msg:'');}
  if(t==='email'){var to=val('emailto');if(!to)return null;var q=[];var s=val('emailsub'),b=val('emailbody');
    if(s)q.push('subject='+encodeURIComponent(s));if(b)q.push('body='+encodeURIComponent(b));
    return 'mailto:'+to+(q.length?'?'+q.join('&'):'');}
  if(t==='wifi'){var ssid=val('wifissid');if(!ssid)return null;var enc=val('wifienc'),pw=val('wifipass');
    if(enc==='nopass')return 'WIFI:T:nopass;S:'+esc(ssid)+';;';
    return 'WIFI:T:'+enc+';S:'+esc(ssid)+';P:'+esc(pw)+';;';}
  if(t==='contact'){var nm=val('cname');if(!nm&&!val('cphone')&&!val('cemail'))return null;
    var v='BEGIN:VCARD\nVERSION:3.0\nN:'+nm+'\nFN:'+nm;
    if(val('corg'))v+='\nORG:'+val('corg');if(val('cphone'))v+='\nTEL:'+val('cphone');
    if(val('cemail'))v+='\nEMAIL:'+val('cemail');if(val('curl'))v+='\nURL:'+val('curl');
    return v+'\nEND:VCARD';}
  return null;
}
var PALETTE=['#1a1a1a','#16243d','#1c3a2a','#5a2230','#3a1f42'];var fg='#1a1a1a';
PALETTE.forEach(function(c,i){var d=document.createElement('div');d.className='sw'+(i===0?' on':'');d.style.background=c;
  d.onclick=function(){fg=c;[].forEach.call(swWrap.children,function(e){e.classList.remove('on')});d.classList.add('on');render();};
  swWrap.appendChild(d);});

function isValid(u){if(!u||u==='https://'||u==='http://')return false;try{new URL(u);return true}catch(e){return false}}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function inFinder(r,c,n){return(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);}
function drawFinder(c,x,y,m,dark,style){var R=style==='square'?0:1;
  c.fillStyle=dark;rr(c,x,y,7*m,7*m,7*m*0.26*R);c.fill();
  c.fillStyle='#fff';rr(c,x+m,y+m,5*m,5*m,5*m*0.26*R);c.fill();
  c.fillStyle=dark;rr(c,x+2*m,y+2*m,3*m,3*m,3*m*0.32*R);c.fill();}
function wrap(c,t,w){var a=t.split(/\s+/),L=[],l='';for(var i=0;i<a.length;i++){var s=l?l+' '+a[i]:a[i];
  if(c.measureText(s).width>w&&l){L.push(l);l=a[i];}else l=s;}if(l)L.push(l);return L;}

function lineIcon(ctx,k,cx,cy,s,color){ctx.strokeStyle=color;ctx.lineWidth=s*0.085;ctx.lineJoin='round';ctx.lineCap='round';ctx.fillStyle=color;
  if(k==='person'){ctx.beginPath();ctx.arc(cx,cy-s*0.24,s*0.2,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-s*0.36,cy+s*0.4);ctx.quadraticCurveTo(cx-s*0.36,cy+s*0.04,cx,cy+s*0.04);
    ctx.quadraticCurveTo(cx+s*0.36,cy+s*0.04,cx+s*0.36,cy+s*0.4);ctx.stroke();}
  else if(k==='phone'){var w=s*0.52,h=s*0.82;rr(ctx,cx-w/2,cy-h/2,w,h,s*0.13);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-s*0.07,cy+h/2-s*0.12);ctx.lineTo(cx+s*0.07,cy+h/2-s*0.12);ctx.stroke();}
  else if(k==='mail'){var ew=s*0.84,eh=s*0.6;rr(ctx,cx-ew/2,cy-eh/2,ew,eh,s*0.1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-ew/2+s*0.05,cy-eh/2+s*0.07);ctx.lineTo(cx,cy+s*0.06);ctx.lineTo(cx+ew/2-s*0.05,cy-eh/2+s*0.07);ctx.stroke();}
  else if(k==='scan'){var c=s*0.46,a=s*0.2;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(p){var x=cx+p[0]*c,y=cy+p[1]*c;ctx.beginPath();
      ctx.moveTo(x-p[0]*a,y);ctx.lineTo(x,y);ctx.lineTo(x,y-p[1]*a);ctx.stroke();});}
  else if(k==='at'){ctx.font='600 '+(s*1.15)+'px Helvetica Neue, Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('@',cx,cy+s*0.02);}
  else if(k==='code'){ctx.font='700 '+(s*0.92)+'px Menlo, Consolas, monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('</>',cx,cy+s*0.02);}}

function render(){
  var u=buildPayload();
  if(!u){dlBtn.disabled=true;status.textContent='Fill in the details to generate';cv.width=100;cv.height=100;ctx.clearRect(0,0,100,100);return;}
  var hasMark=iconI.value!=='none';
  var qr;try{qr=QRCode.create(u,{errorCorrectionLevel:hasMark?'H':'Q'});}catch(e){status.textContent='Too much data for one code';dlBtn.disabled=true;return;}
  var n=qr.modules.size,data=qr.modules.data,m=18,quiet=4,qrPx=(n+quiet*2)*m;
  var cap=capI.value.trim(),capFont=Math.round(m*2.5);
  var mc=cv.getContext('2d');mc.font='400 '+capFont+'px Helvetica Neue, Arial, sans-serif';
  var capLines=cap?wrap(mc,cap,qrPx*0.92):[];
  var pad=Math.round(m*1.6);
  var capBlock=cap?(capLines.length*capFont*1.3+m*1.6):0;
  var W=qrPx+pad*2,H=pad+qrPx+(cap?m*1.4:pad)+capBlock;
  cv.width=W;cv.height=H;
  ctx.fillStyle='#ffffff';rr(ctx,0,0,W,H,m*2.2);ctx.fill();

  var ox=pad+quiet*m,oy=pad+quiet*m,style=styleI.value;ctx.fillStyle=fg;
  for(var r=0;r<n;r++)for(var ci=0;ci<n;ci++){
    if(!data[r*n+ci]||inFinder(r,ci,n))continue;var x=ox+ci*m,y=oy+r*m;
    if(style==='dots'){ctx.beginPath();ctx.arc(x+m/2,y+m/2,m*0.42,0,7);ctx.fill();}
    else if(style==='square'){ctx.fillRect(x,y,m,m);}
    else{rr(ctx,x+m*0.08,y+m*0.08,m*0.84,m*0.84,m*0.34);ctx.fill();}}
  drawFinder(ctx,ox,oy,m,fg,style);drawFinder(ctx,ox+(n-7)*m,oy,m,fg,style);drawFinder(ctx,ox,oy+(n-7)*m,m,fg,style);

  if(iconI.value!=='none'){var cx=pad+qrPx/2,cy=pad+qrPx/2,badge=qrPx*0.2;
    if(iconI.value==='custom'){
      if(customImg){var R=badge*0.92;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,R*0.9,0,7);ctx.fill();
        ctx.save();ctx.beginPath();ctx.arc(cx,cy,R*0.78,0,7);ctx.clip();
        var iw=customImg.width,ih=customImg.height,sc=Math.max((R*1.56)/iw,(R*1.56)/ih);
        ctx.drawImage(customImg,cx-iw*sc/2,cy-ih*sc/2,iw*sc,ih*sc);ctx.restore();}
      else if(iconEmoji.value){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,badge*0.82,0,7);ctx.fill();
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(badge*1.1)+'px Helvetica Neue, Arial, sans-serif';ctx.fillText(iconEmoji.value,cx,cy+badge*0.04);}
    } else {
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,badge*0.78,0,7);ctx.fill();
      lineIcon(ctx,iconI.value,cx,cy,badge*0.92,fg);}
  }

  if(cap){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='400 '+capFont+'px Helvetica Neue, Arial, sans-serif';
    ctx.fillStyle=fg;var lh=capFont*1.3,cy2=pad+qrPx+m*1.6+capBlock/2,sy=cy2-((capLines.length-1)*lh)/2;
    for(var i=0;i<capLines.length;i++)ctx.fillText(capLines[i],W/2,sy+i*lh);}
  dlBtn.disabled=false;status.textContent='Ready — scan to test, then download';
}
function download(){var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='qr-code.png';
  document.body.appendChild(a);a.click();document.body.removeChild(a);}
function showGroup(){var t=qrtypeI.value;[].forEach.call(document.querySelectorAll('.grp'),function(g){
  g.style.display=g.getAttribute('data-t')===t?'block':'none';});render();}
qrtypeI.addEventListener('change',showGroup);
[].forEach.call(document.querySelectorAll('.grp input, .grp select'),function(el){el.addEventListener('input',render);});
[capI,iconEmoji,styleI].forEach(function(el){el.addEventListener('input',render);});
iconI.addEventListener('change',function(){customMark.style.display=iconI.value==='custom'?'block':'none';render();});
iconFile.addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){customImg=im;render();};im.src=rd.result;};rd.readAsDataURL(f);});
dlBtn.addEventListener('click',download);showGroup();
</script>
</body>
</html>
